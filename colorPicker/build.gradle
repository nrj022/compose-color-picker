// Credentials and signing keys are read from Gradle properties
// (~/.gradle/gradle.properties or ORG_GRADLE_PROJECT_* env vars):
// mavenCentralUsername, mavenCentralPassword,
// signing.keyId, signing.password, signing.secretKeyRingFile
mavenPublishing {
    publishToMavenCentral()
    // Maven Central rejects unsigned artifacts; skipping lets publishToMavenLocal work without keys
    if (providers.gradleProperty("signing.keyId").isPresent() || providers.gradleProperty("signingInMemoryKey").isPresent()) {
        signAllPublications()
    }

    // JitPack sets JITPACK, GROUP (com.github.<user>) and VERSION (the git tag) when building
    def onJitPack = System.getenv("JITPACK") == "true"
    coordinates(
        onJitPack ? System.getenv("GROUP") : GROUP_ID,
        ARTIFACT_ID,
        onJitPack ? System.getenv("VERSION") : VERSION
    )

    pom {
        name = ARTIFACT_ID
        description = "A color picker for Jetpack compose"
        url = "https://github.com/nrj022/compose-color-picker"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "nrj022"
                name = "nrj022"
                url = "https://github.com/nrj022"
            }
            // Original author (forked from mhssn95/compose-color-picker)
            developer {
                id = "mhssn"
                name = "Mhssn Alrobily"
                url = "https://github.com/mhssn95"
            }
        }
        scm {
            connection = "scm:git:git://github.com/nrj022/compose-color-picker.git"
            developerConnection = "scm:git:ssh://git@github.com/nrj022/compose-color-picker.git"
            url = "https://github.com/nrj022/compose-color-picker"
        }
    }
}

